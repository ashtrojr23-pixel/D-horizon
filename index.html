<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LifeOS — Your Personal Life Dashboard</title>
<link rel="manifest" href="./manifest.json"/>
<meta name="theme-color" content="#0a0a12"/>
<link rel="stylesheet" href="./css/main.css"/>
<link rel="stylesheet" href="./css/animations.css"/>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

  .login-scene {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 1;
  }

  .login-card {
    width: 100%;
    max-width: 440px;
    background: rgba(10,10,18,0.92);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 28px;
    padding: 48px 40px;
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    box-shadow: 0 0 80px rgba(26,58,255,0.15), 0 40px 80px rgba(0,0,0,0.6);
    animation: scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
    position: relative;
    overflow: hidden;
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(26,58,255,0.6), rgba(255,45,120,0.6), transparent);
  }

  .login-card-glow {
    position: absolute;
    inset: -100px;
    background: radial-gradient(ellipse at 50% 0%, rgba(26,58,255,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .login-logo {
    text-align: center;
    margin-bottom: 36px;
  }

  .login-logo-mark {
    width: 68px;
    height: 68px;
    border-radius: 20px;
    background: linear-gradient(135deg, #1a3aff, #ff2d78);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    margin: 0 auto 16px;
    box-shadow: 0 0 40px rgba(26,58,255,0.4), 0 0 80px rgba(255,45,120,0.2);
    animation: glow-blue 3s ease-in-out infinite;
  }

  .login-title {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--blue-light), var(--pink-light));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }

  .login-subtitle { font-size: 0.85rem; color: var(--white-dim); }

  .login-tabs {
    display: flex;
    background: rgba(255,255,255,0.04);
    border-radius: var(--radius-pill);
    padding: 4px;
    margin-bottom: 28px;
    gap: 4px;
  }
  .login-tab {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius-pill);
    border: none;
    background: transparent;
    color: var(--white-dim);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }
  .login-tab.active {
    background: var(--gradient-main);
    color: #fff;
    box-shadow: 0 0 16px var(--blue-glow);
  }

  .login-form { display: flex; flex-direction: column; gap: 16px; }

  .login-form-panel { display: none; }
  .login-form-panel.active { display: flex; flex-direction: column; gap: 16px; }

  .login-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.78rem;
    color: var(--white-dim);
  }

  .hover-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .hover-orb {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(26,58,255,0.15) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    transition: left 0.8s ease, top 0.8s ease;
    pointer-events: none;
  }

  @media (max-width: 480px) {
    .login-card { padding: 32px 24px; }
  }
</style>
</head>
<body>

<!-- Background orbs -->
<div class="orb orb-blue"></div>
<div class="orb orb-pink"></div>
<div class="orb orb-blue-2"></div>

<!-- Hover overlay -->
<div class="hover-overlay" id="hover-overlay">
  <div class="hover-orb" id="hover-orb"></div>
</div>

<!-- Star field -->
<div id="star-field" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;"></div>

<div class="login-scene">
  <div class="login-card" id="login-card">
    <div class="login-card-glow"></div>

    <div class="login-logo">
      <div class="login-logo-mark">🌟</div>
      <div class="login-title">LifeOS</div>
      <div class="login-subtitle">Your cinematic personal life dashboard</div>
    </div>

    <div class="login-tabs">
      <button class="login-tab active" data-tab="login">Sign In</button>
      <button class="login-tab" data-tab="register">Register</button>
    </div>

    <!-- LOGIN -->
    <div class="login-form-panel active" id="panel-login">
      <div class="input-group">
        <label class="input-label">Username</label>
        <input class="input" type="text" id="login-username" placeholder="your_username" autocomplete="username"/>
      </div>
      <div class="input-group">
        <label class="input-label">Password</label>
        <input class="input" type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn btn-primary w-full" id="login-btn" style="margin-top:8px;justify-content:center;">
        ✦ Sign In to LifeOS
      </button>
      <div id="login-error" class="text-red text-sm text-center hidden"></div>
    </div>

    <!-- REGISTER -->
    <div class="login-form-panel" id="panel-register">
      <div class="input-group">
        <label class="input-label">Full Name</label>
        <input class="input" type="text" id="reg-name" placeholder="e.g. Alex Kamau"/>
      </div>
      <div class="input-group">
        <label class="input-label">Username</label>
        <input class="input" type="text" id="reg-username" placeholder="unique_username" autocomplete="username"/>
      </div>
      <div class="input-group">
        <label class="input-label">Password (min 6 characters)</label>
        <input class="input" type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password"/>
      </div>
      <div class="input-group">
        <label class="input-label">Confirm Password</label>
        <input class="input" type="password" id="reg-confirm" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary w-full" id="register-btn" style="margin-top:8px;justify-content:center;">
        ✦ Create My LifeOS
      </button>
      <div id="reg-error" class="text-red text-sm text-center hidden"></div>
    </div>

    <div class="login-footer">
      Your data is stored locally on this device only.<br/>
      <span class="text-blue">100% Private · Offline Ready · Encrypted</span>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="./js/storage.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/app.js"></script>
<script>
  // Init storage (no encryption key yet at login stage)
  LifeOS.init('');

  // Redirect if already logged in
  if (Auth.isLoggedIn()) window.location.href = './dashboard.html';

  // Star field
  initStarField(document.getElementById('star-field'));

  // Hover orb parallax
  const hoverOrb = document.getElementById('hover-orb');
  document.addEventListener('mousemove', (e) => {
    hoverOrb.style.left = e.clientX + 'px';
    hoverOrb.style.top = e.clientY + 'px';
  });

  // Tabs
  document.querySelectorAll('.login-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.login-form-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  // Login
  document.getElementById('login-btn').addEventListener('click', () => {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const err = document.getElementById('login-error');
    const result = Auth.login(username, password);
    if (result.ok) {
      Toast.show('Welcome back, ' + result.user.name + '! 🎉', 'success');
      setTimeout(() => window.location.href = './dashboard.html', 800);
    } else {
      err.textContent = result.msg;
      err.classList.remove('hidden');
      setTimeout(() => err.classList.add('hidden'), 3000);
    }
  });

  // Register
  document.getElementById('register-btn').addEventListener('click', () => {
    const name = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-confirm').value;
    const err = document.getElementById('reg-error');

    if (password !== confirm) {
      err.textContent = 'Passwords do not match.';
      err.classList.remove('hidden');
      return;
    }
    const result = Auth.register(username, password, name);
    if (result.ok) {
      // Auto login
      Auth.login(username, password);
      Toast.show('Account created! Welcome, ' + (name || username) + '! ✨', 'success');
      setTimeout(() => window.location.href = './dashboard.html', 800);
    } else {
      err.textContent = result.msg;
      err.classList.remove('hidden');
      setTimeout(() => err.classList.add('hidden'), 3000);
    }
  });

  // Enter key support
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const activePanel = document.querySelector('.login-form-panel.active');
      if (activePanel?.id === 'panel-login') document.getElementById('login-btn').click();
      else document.getElementById('register-btn').click();
    }
  });
</script>
</body>
</html>
