<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Goals & Dreams — LifeOS</title>
<link rel="manifest" href="./manifest.json"/>
<link rel="stylesheet" href="./css/main.css"/>
<link rel="stylesheet" href="./css/animations.css"/>
<link rel="stylesheet" href="./css/dashboard.css"/>
<link rel="stylesheet" href="./css/goals.css"/>
</head>
<body>
<div class="orb orb-blue"></div>
<div class="orb orb-pink"></div>

<div class="page-wrapper">
  <div class="container section">

    <div class="section-header animate-fade-up">
      <div>
        <h1>Goals & Dreams <span class="shimmer-text">✦</span></h1>
        <p class="mt-8">Everything you're working towards, sorted by timeline.</p>
      </div>
      <button class="btn btn-primary" id="add-goal-btn">＋ Add Goal</button>
    </div>

    <!-- Category Tabs -->
    <div id="category-tabs" class="category-tabs animate-fade-up delay-2"></div>

    <!-- Short Term -->
    <div class="animate-fade-up delay-2" style="margin-bottom:32px;">
      <div class="plans-section plans-short">
        <div class="plans-section-header">
          <div class="flex items-center gap-12">
            <span style="font-size:1.3rem;">⏱️</span>
            <div>
              <h3 style="margin:0;">Short-Term Plans</h3>
              <div class="text-xs text-dim">0–6 months from now</div>
            </div>
          </div>
          <span class="badge badge-blue" id="count-short">0</span>
        </div>
        <div class="plans-section-body" id="goals-short"></div>
      </div>
    </div>

    <!-- Long Term -->
    <div class="animate-fade-up delay-3" style="margin-bottom:32px;">
      <div class="plans-section plans-long">
        <div class="plans-section-header">
          <div class="flex items-center gap-12">
            <span style="font-size:1.3rem;">🗓️</span>
            <div>
              <h3 style="margin:0;">Long-Term Plans</h3>
              <div class="text-xs text-dim">6 months to 3 years</div>
            </div>
          </div>
          <span class="badge badge-pink" id="count-long">0</span>
        </div>
        <div class="plans-section-body" id="goals-long"></div>
      </div>
    </div>

    <!-- Future -->
    <div class="animate-fade-up delay-4" style="margin-bottom:32px;">
      <div class="plans-section plans-future">
        <div class="plans-section-header">
          <div class="flex items-center gap-12">
            <span style="font-size:1.3rem;">🌌</span>
            <div>
              <h3 style="margin:0;">The Future</h3>
              <div class="text-xs text-dim">3+ years ahead</div>
            </div>
          </div>
          <span class="badge badge-gold" id="count-future">0</span>
        </div>
        <div class="plans-section-body" id="goals-future"></div>
      </div>
    </div>

    <!-- Expired -->
    <div class="animate-fade-up delay-5" style="margin-bottom:120px;">
      <div class="plans-section" style="border-color:rgba(255,59,92,0.2);">
        <div class="plans-section-header" style="background:rgba(255,59,92,0.06);">
          <div class="flex items-center gap-12">
            <span style="font-size:1.3rem;">📦</span>
            <div>
              <h3 style="margin:0;">Expired / Past Due</h3>
              <div class="text-xs text-dim">Goals past their target date</div>
            </div>
          </div>
          <span class="badge badge-red" id="count-expired">0</span>
        </div>
        <div class="plans-section-body" id="goals-expired"></div>
      </div>
    </div>

  </div>
</div>

<!-- Add/Edit Goal Modal -->
<div class="modal-overlay" id="goal-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="goal-modal-title">New Goal</h3>
      <button class="modal-close" id="goal-modal-close">✕</button>
    </div>

    <!-- Image Upload -->
    <div class="input-group" style="margin-bottom:20px;">
      <label class="input-label">📸 Cover Image (optional)</label>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <label class="btn btn-glass btn-sm" style="cursor:pointer;">
          Upload Image
          <input type="file" id="goal-image-upload" accept="image/*" style="display:none;"/>
        </label>
        <img id="goal-image-preview" src="" alt="preview" class="hidden" style="width:80px;height:60px;border-radius:8px;object-fit:cover;border:1px solid var(--glass-border);"/>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="input-group" style="grid-column:1/-1;">
        <label class="input-label">Goal Name *</label>
        <input class="input" type="text" id="goal-name" placeholder="e.g. Buy a Tesla Model S"/>
      </div>
      <div class="input-group">
        <label class="input-label">Category</label>
        <select class="input" id="goal-category">
          <option value="dream">💭 Dream</option>
          <option value="project">🚀 Project</option>
          <option value="car">🚗 Car</option>
          <option value="house">🏠 House</option>
          <option value="furniture">🛋️ Furniture</option>
          <option value="shopping">🛒 Shopping</option>
          <option value="education">📚 Education</option>
          <option value="travel">✈️ Travel</option>
          <option value="health">💪 Health</option>
          <option value="business">💼 Business</option>
          <option value="other">📌 Other</option>
        </select>
      </div>
      <div class="input-group">
        <label class="input-label">Price (KSh)</label>
        <input class="input" type="number" id="goal-price" placeholder="0" min="0"/>
      </div>
      <div class="input-group" style="grid-column:1/-1;">
        <label class="input-label">Target Date *</label>
        <input class="input" type="date" id="goal-target-date"/>
      </div>
      <div class="input-group" style="grid-column:1/-1;">
        <label class="input-label">Description</label>
        <input class="input" type="text" id="goal-description" placeholder="Short description..."/>
      </div>
      <div class="input-group" style="grid-column:1/-1;">
        <label class="input-label">Notes</label>
        <textarea class="input" id="goal-notes" rows="3" placeholder="Extra notes, plans, motivation..." style="resize:vertical;"></textarea>
      </div>
    </div>

    <div style="display:flex;gap:12px;margin-top:24px;justify-content:flex-end;">
      <button class="btn btn-glass" id="goal-modal-close2" onclick="Modal.close('goal-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-goal-btn">Save Goal</button>
    </div>
  </div>
</div>

<script src="./js/storage.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/app.js"></script>
<script src="./js/goals.js"></script>
<script src="./js/island.js"></script>
<script>
  injectIsland('goals');
  // Set min date to today
  document.getElementById('goal-target-date').min = new Date().toISOString().split('T')[0];
  Goals.init();
  updateFinanceWidget();
</script>
</body>
</html>
